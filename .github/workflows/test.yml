name: Test

on:
  push:
    # main 上的测试由部署工作流负责（测试通过才部署），这里避免重复运行
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # 四个浏览器 / 设备组合各占一台机器并行运行，总时长约等于最慢的那一组。
  # 计时类的断言在 CI 里只记录数据、不判定失败（GitHub 的机器比开发机慢得多），其余检查照常
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, webkit-desktop, chromium-iphone, webkit-iphone]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps ${{ startsWith(matrix.project, 'chromium') && 'chromium' || 'webkit' }}
      - name: End-to-end tests
        run: npx playwright test --project=${{ matrix.project }}
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
