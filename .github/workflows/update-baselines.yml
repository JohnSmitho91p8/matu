name: Update screenshot baselines

# 手动运行：在 GitHub 的 Ubuntu 环境里重新生成截图对比的基准图并提交。
# 字体渲染随系统而异，本地（macOS）和这里（Linux）的基准图分开存放。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # 只跑截图对比（电脑尺寸，两个引擎）；其余测试不在这里运行
      - name: Generate baselines
        run: npx playwright test screenshots.spec.js --project=chromium-desktop --project=webkit-desktop --update-snapshots
        continue-on-error: true
      - name: Commit new baselines
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines are already up to date"
          else
            git commit -m "Update screenshot baselines"
            git push
          fi
